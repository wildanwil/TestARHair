name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ekstrak proyek
        run: unzip -q hair-tryon.zip -d src

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: src/hair-tryon
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: hair-tryon-debug-apk
          path: src/hair-tryon/app/build/outputs/apk/debug/app-debug.apk
